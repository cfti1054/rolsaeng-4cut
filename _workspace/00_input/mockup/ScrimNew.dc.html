<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내전 모집글 작성</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0A0B14}
body:has(.gcd[data-theme="light"]){background:#F3F4F8}
.gcd{color-scheme:dark;--bg:#0A0B14;--nav:#0D0F1A;--nav-line:#1C1F2E;--surface:#11131F;--line:#1E2235;--surface-2:#171A29;--surface-3:#151827;--line-2:#252A40;--line-3:#2A2F47;--line-4:#3A4166;--hero:#10132A;--hero-2:#0C0F22;--hero-3:#131838;--hero-line:#252B52;--hero-line-2:#2E3560;--hero-faint:#8E96C8;--avatar-deep:#1B2A4D;--banner-lol:#0F1B24;--banner-tft:#17132A;--banner-steam:#21150F;--text:#F2F4FA;--text-2:#C9CEE0;--muted:#A3AAC0;--faint:#7F879E;--on-accent:#0A0B14;--overlay:#FFFFFF;--hi:#FFFFFF0A;--chip:#FFFFFF0F;--hair:#FFFFFF0D;--hair-2:#FFFFFF08;--shadow:#00000080;--hover:#FFFFFF0A;--lift:0 16px 32px #00000066;--seg-shadow:0 1px 0 #FFFFFF14 inset,0 2px 6px #00000059;--accent:#D4FF3A;--accent-ink:var(--accent);--accent-ink-hover:#E6FF85;--cyan:#3BD6C6;--cyan-text:#3BD6C6;--cyan-ink:#7FE8DC;--cyan-ink-2:#BDF3EC;--violet:#B18CFF;--violet-text:#B18CFF;--violet-ink:#CDB5FF;--orange:#FF8A3D;--orange-text:#FF8A3D;--orange-ink:#FFB98A;--orange-ink-2:#FFAA6E;--warn-text:#FFD3B3;--warn-text-2:#E9C3A8;--blue:#4C8DFF;--blue-text:#4C8DFF;--blue-ink:#9CC1FF;--gold:#F5C451;--gold-text:#F5C451;--gold-ink:#F8D883;--silver:#C9D1DC;--silver-text:#C9D1DC;--bronze:#E0A070;--bronze-text:#E0A070;--pink-ink:#FF9CB1}
.gcd[data-theme="light"]{color-scheme:light;--bg:#F3F4F8;--nav:#FFFFFF;--nav-line:#E3E6EE;--surface:#FFFFFF;--line:#E3E6EE;--surface-2:#F6F7FA;--surface-3:#FFFFFF;--line-2:#E0E4EC;--line-3:#D2D7E2;--line-4:#B4BBCC;--hero:#EDEFFC;--hero-2:#E3E7FA;--hero-3:#DFE4F9;--hero-line:#D6DBF3;--hero-line-2:#BFC6EA;--hero-faint:#565E8C;--avatar-deep:#DCE6FF;--banner-lol:#E2F5F2;--banner-tft:#EEE8FC;--banner-steam:#FCEDE2;--text:#12141D;--text-2:#383E52;--muted:#535A6F;--faint:#656D84;--on-accent:#0A0B14;--overlay:#0A0B14;--hi:#FFFFFF00;--chip:#0A0B140A;--hair:#0A0B1412;--hair-2:#0A0B140A;--shadow:#1A1F3A2E;--hover:#0A0B140A;--lift:0 16px 32px #1A1F3A1F;--seg-shadow:0 1px 3px #1A1F3A26;--accent:#C6F135;--accent-ink:color-mix(in oklab,var(--accent) 36%,#000);--accent-ink-hover:color-mix(in oklab,var(--accent) 26%,#000);--cyan:#22BFAE;--cyan-text:#0B746A;--cyan-ink:#0B746A;--cyan-ink-2:#0B6A61;--violet:#9B72F5;--violet-text:#6236C8;--violet-ink:#6236C8;--orange:#FF8A3D;--orange-text:#A84B0C;--orange-ink:#A84B0C;--orange-ink-2:#A84B0C;--warn-text:#7C3307;--warn-text-2:#6E4128;--blue:#4C8DFF;--blue-text:#2457C2;--blue-ink:#2457C2;--gold:#E5AE22;--gold-text:#845C00;--gold-ink:#845C00;--silver:#A7B0C0;--silver-text:#586174;--bronze:#CF8550;--bronze-text:#94501F;--pink-ink:#B8264F}
.gcd a{color:var(--accent-ink)}.gcd a:hover{color:var(--accent-ink-hover)}
.gcd,.gcd section,.gcd nav,.gcd article,.gcd header,.gcd div,.gcd span,.gcd button,.gcd a,.gcd input,.gcd select,.gcd textarea,.gcd tr{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .2s ease}
.gcd nav a:hover{background:var(--hover)}
.gcd button:hover,.gcd a[href]:hover{filter:brightness(1.05)}
.gcd article:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.gcd :focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.gcd input::placeholder,.gcd textarea::placeholder{color:var(--faint)}
@media (prefers-reduced-motion:reduce){.gcd,.gcd *{transition:none!important}.gcd article:hover{transform:none}}
</style>
</helmet>
<div class="gcd" data-theme="{{themeAttr}}" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans KR', system-ui, sans-serif; display: flex; flex-wrap: wrap">
  <nav aria-label="주 메뉴" style="flex: 1 1 232px; background: var(--nav); border-right: 1px solid var(--nav-line); padding: 22px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 36 36"><path d="M11 3h22l-7 30H4z" style="fill: var(--accent)"></path><path d="M15 10h9.5l-1.3 6H19l-2.3 10h-4.6z" style="fill: var(--on-accent)"></path></svg>
      <div style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 700; font-size: 17px; letter-spacing: -0.02em">롤생네컷</span><span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: var(--faint)">GAME CLUB</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="padding: 0 12px 8px; font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: var(--faint)">MENU</span>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>홈</a>
      <a href="Scrims.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: #D4FF3A14; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--accent)"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6"></path><path d="m16 16 4 4"></path><path d="m19 21 2-2"></path><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"></path><path d="m11 19-6-6"></path><path d="m8 16-4 4"></path><path d="m5 21-2-2"></path></svg>내전<span style="margin-left: auto; font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent)">3</span></a>
      <a href="Rankings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v6a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 5"></path><path d="M16 6h3a3 3 0 0 1-3 5"></path><path d="M12 14v4"></path><path d="M8 21h8"></path></svg>랭킹</a>
      <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>내 프로필</a>
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9"></path><path d="M19 6h1"></path><circle cx="16" cy="6" r="2.5"></circle><path d="M4 12h3"></path><path d="M13 12h7"></path><circle cx="10" cy="12" r="2.5"></circle><path d="M4 18h11"></path><circle cx="18" cy="18" r="2.5"></circle></svg>설정</a>
    </div>
    <div role="group" aria-label="화면 테마" style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line)">
      <button type="button" aria-pressed="{{themeLight.pressed}}" onClick="{{themeLight.pick}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; border: 0; background: {{themeLight.bg}}; color: {{themeLight.fg}}; box-shadow: {{themeLight.shadow}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: {{themeLight.icon}}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>라이트</button>
      <button type="button" aria-pressed="{{themeDark.pressed}}" onClick="{{themeDark.pick}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 10px; border: 0; background: {{themeDark.bg}}; color: {{themeDark.fg}}; box-shadow: {{themeDark.shadow}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: {{themeDark.icon}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>다크</button>
    </div>
    <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; text-decoration: none; color: var(--text)">
      <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: #4C8DFF2E; color: var(--blue-ink); display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 0 0 2px var(--nav), 0 0 0 4px var(--accent)">새</span>
      <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 14px; font-weight: 600">새벽감자</span><span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; color: var(--muted)">ELO 1421 · #3</span></span>
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 56px; box-sizing: border-box">
    <div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
      <header style="display: flex; flex-direction: column; gap: 6px">
        <a href="Scrims.dc.html" style="font-size: 13px; text-decoration: none; color: var(--muted)">← 내전 목록</a>
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--faint); margin-top: 4px">NEW SCRIM</span>
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em">내전 모집글 작성</h1>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <form style="flex: 2 1 540px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 24px; box-shadow: inset 0 1px 0 var(--hi)">
          <fieldset style="border: 0; padding: 0; margin: 0">
            <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 12px"><span style="font-family: 'Chakra Petch', sans-serif; color: var(--accent-ink); margin-right: 8px">01</span>게임 선택</legend>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{games}}" as="g" hint-placeholder-count="3">
                <button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="position: relative; text-align: left; padding: 16px; border-radius: 16px; border: 1.5px solid {{g.border}}; background: {{g.bg}}; color: var(--text); font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 10px; min-height: 112px; overflow: hidden">
                  <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{g.tileBg}}; color: {{g.tileFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px">{{g.abbr}}</span>
                  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{g.label}}</span><span style="font-size: 12px; color: var(--muted)">{{g.desc}}</span></span>
                  <sc-if value="{{g.on}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 11px; background: var(--accent); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--on-accent)"><path d="m5 12 5 5 9-10"></path></svg></span></sc-if>
                </button>
              </sc-for>
            </div>
          </fieldset>

          <div style="display: flex; flex-direction: column; gap: 14px">
            <span style="font-size: 14px; font-weight: 700"><span style="font-family: 'Chakra Petch', sans-serif; color: var(--accent-ink); margin-right: 8px">02</span>기본 정보</span>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <label for="title" style="font-size: 13px; color: var(--muted)">제목</label>
              <input id="title" type="text" value="화요일 저녁 5:5 내전" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line-3); background: var(--bg); color: var(--text); font: inherit; font-size: 15px">
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 14px">
              <div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 8px">
                <label for="date" style="font-size: 13px; color: var(--muted)">날짜</label>
                <input id="date" type="text" value="2026-10-28 (수)" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line-3); background: var(--bg); color: var(--text); font: inherit; font-size: 15px">
              </div>
              <div style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 8px">
                <label for="time" style="font-size: 13px; color: var(--muted)">시작 시간</label>
                <input id="time" type="text" value="21:00" style="height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line-3); background: var(--bg); color: var(--text); font-family: 'Chakra Petch', sans-serif; font-size: 16px; font-weight: 600">
              </div>
              <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 8px">
                <span id="cap-label" style="font-size: 13px; color: var(--muted)">정원</span>
                <div role="group" aria-labelledby="cap-label" style="display: flex; align-items: center; height: 48px; border-radius: 14px; border: 1px solid var(--line-3); background: var(--bg); padding: 0 4px">
                  <button type="button" aria-label="정원 줄이기" onClick="{{dec}}" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; cursor: pointer">−</button>
                  <span style="flex: 1; text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700">{{cap}}</span>
                  <button type="button" aria-label="정원 늘리기" onClick="{{inc}}" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; cursor: pointer">+</button>
                </div>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 14px; font-weight: 700"><span style="font-family: 'Chakra Petch', sans-serif; color: var(--accent-ink); margin-right: 8px">03</span>진행 방식</span>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
                <button type="button" role="switch" aria-checked="{{o.checked}}" disabled="{{o.off}}" onClick="{{o.toggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; text-align: left; cursor: pointer; opacity: {{o.opacity}}">
                  <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{o.label}}</span><span style="font-size: 12px; color: var(--muted)">{{o.desc}}</span></span>
                  <span aria-hidden="true" style="flex: 0 0 auto; width: 44px; height: 26px; border-radius: 13px; background: {{o.track}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{o.justify}}"><span style="width: 20px; height: 20px; border-radius: 10px; background: {{o.knob}}"></span></span>
                </button>
              </sc-for>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="rules" style="font-size: 14px; font-weight: 700"><span style="font-family: 'Chakra Petch', sans-serif; color: var(--accent-ink); margin-right: 8px">04</span>규칙</label>
            <textarea id="rules" rows="4" style="padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line-3); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; line-height: 1.7; resize: vertical">토너먼트 드래프트, 피어리스 없음. 20:50까지 음성 채널 입장. 노쇼 3회(30일) 시 7일간 참가 제한.</textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line)">
            <a href="Scrims.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 20px; margin-top: 16px; border-radius: 14px; border: 1px solid var(--line-3); color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600">취소</a>
            <a href="ScrimDetail.dc.html" style="display: flex; align-items: center; height: 48px; padding: 0 26px; margin-top: 16px; border-radius: 14px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 14px; font-weight: 700">모집 시작</a>
          </div>
        </form>

        <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
          <span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; color: var(--faint)">PREVIEW</span>
          <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: inset 0 1px 0 var(--hi)">
            <div style="position: relative; height: 92px; background: {{cur.bannerBg}}; overflow: hidden">
              <svg aria-hidden="true" viewBox="0 0 360 92" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%"><polygon points="210,0 360,0 360,92 170,92" fill-opacity="0.16" style="fill: {{cur.tileFg}}"></polygon><line x1="210" y1="0" x2="170" y2="92" stroke-opacity="0.5" stroke-width="1.5" style="stroke: {{cur.tileFg}}"></line></svg>
              <div style="position: absolute; inset: 0; padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-start"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: {{cur.tileFg}}">{{cur.tag}}</span><span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent)">모집 중</span></div>
              <span style="position: absolute; left: 18px; bottom: 12px; font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 700">21:00</span>
            </div>
            <div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 16px; font-weight: 700">화요일 저녁 5:5 내전</span>
              <span style="font-size: 13px; color: var(--muted)">10.28 (수) · 방장 새벽감자</span>
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: var(--orange-ink-2)">{{left}}자리 남음</span><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 600">1 / {{cap}}</span></div>
              <div style="display: flex; gap: 3px"><sc-for list="{{pips}}" as="p" hint-placeholder-count="10"><span style="flex: 1; height: 8px; border-radius: 2px; background: {{p.c}}"></span></sc-for></div>
            </div>
          </article>
