<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","system"],"default":"dark"},"$preview":{"width":1440,"height":1160}}'>

  componentDidMount() {

    const pips = (n, cap, c) => Array.from({ length: cap }, (_, i) => ({ c: i < n ? c : 'var(--line-2)' }));
    const all = [
      { ...lol, ...open, title: '화요일 저녁 5:5 내전', clock: '21:00', day: '오늘', host: '미드고정', tags: ['자동 밸런스', '포지션 선택', 'ELO 반영'], count: '8 / 10', pips: pips(8, 10, 'var(--cyan)'), need: '서폿 1 · 정글 1 구함' },
      { ...tft, ...open, title: '롤체 8인 친선 로비', clock: '22:30', day: '오늘', host: '체스왕', tags: ['8인 개인전', 'ELO 반영'], count: '5 / 8', pips: pips(5, 8, 'var(--violet)'), need: '3자리 남음' },
      { ...lol, ...full, title: '주말 협곡 2판 연속', clock: '20:00', day: '토요일', host: '새벽감자', tags: ['자동 밸런스', '2판'], count: '10 / 10', pips: pips(10, 10, 'var(--orange)'), need: '대기 2명' },
      { ...lol, ...joined, title: '골드 이하 초보 환영 내전', clock: '21:30', day: '수요일', host: '서폿요정', tags: ['골드 이하', '피드백 환영'], count: '6 / 10', pips: pips(6, 10, 'var(--cyan)'), need: '탑 · 원딜 · 서폿 구함' },
      { ...steam, ...open, title: '배틀그라운드 스쿼드 2팀', clock: '22:00', day: '목요일', host: '바론스틸', tags: ['4:4', 'ELO 미반영'], count: '5 / 8', pips: pips(5, 8, 'var(--orange)'), need: '3자리 남음' },
      { ...tft, ...open, title: '롤체 더블업 4팀', clock: '21:00', day: '금요일', host: '별빛미드', tags: ['2인 1팀', 'ELO 반영'], count: '4 / 8', pips: pips(4, 8, 'var(--violet)'), need: '2팀 남음' }
    ];
    const g = this.state.game;
    const list = g === 'all' ? all : all.filter((s) => s.code === g);
    const games = [
      { id: 'all', label: '전체', n: '6', dot: 'var(--text)' }, { id: 'lol', label: '롤 협곡', n: '3', dot: 'var(--cyan)' },
      { id: 'tft', label: '롤체', n: '2', dot: 'var(--violet)' }, { id: 'steam', label: '스팀', n: '1', dot: 'var(--orange)' }
    ].map((x) => {
      const on = x.id === g;
      return { ...x, pressed: on ? 'true' : 'false', bg: on ? 'var(--accent)' : 'transparent', fg: on ? 'var(--on-accent)' : 'var(--text-2)', dot: on ? 'var(--on-accent)' : x.dot, pick: () => this.setState({ game: x.id }) };
    });
    return { games, list };
  }
}
